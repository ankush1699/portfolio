<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" role="img" aria-labelledby="t d">
  <title id="t">Job Search and Resume Pipeline overview</title>
  <desc id="d">Entry modes feed a should-apply gate, then keyword and bullet selection, then a Claude Sonnet writer, then validators, then a LaTeX PDF.</desc>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#4B515A"/>
    </marker>
    <style>
      text { font-family: Inter, system-ui, -apple-system, 'Segoe UI', sans-serif; }
      .h { font-size: 15px; font-weight: 700; fill: #1E2126; }
      .s { font-size: 12px; fill: #4B515A; }
      .n { font-size: 13px; fill: #4B515A; }
      .box { fill: #FFFFFF; stroke: #C3C8CF; stroke-width: 1.5; }
      .gate { fill: #FFFFFF; stroke: #7A1F2B; stroke-width: 2.5; }
      .line { stroke: #4B515A; stroke-width: 2; fill: none; }
    </style>
  </defs>
  <rect width="640" height="400" rx="24" fill="#EEF0F2"/>

  <rect class="box" x="24" y="40" width="176" height="96" rx="14"/>
  <text class="h" x="40" y="72">Entry modes</text>
  <text class="s" x="40" y="94">Scraper, manual paste</text>
  <text class="s" x="40" y="112">and form autofill</text>

  <rect class="gate" x="232" y="40" width="176" height="96" rx="14"/>
  <text class="h" x="248" y="72">Should-apply gate</text>
  <text class="s" x="248" y="94">Red flags, then cache,</text>
  <text class="s" x="248" y="112">then fit scoring</text>

  <rect class="box" x="440" y="40" width="176" height="96" rx="14"/>
  <text class="h" x="456" y="72">Tailoring</text>
  <text class="s" x="456" y="94">Keyword extraction and</text>
  <text class="s" x="456" y="112">bullet selection</text>

  <rect class="box" x="440" y="220" width="176" height="96" rx="14"/>
  <text class="h" x="456" y="252">Claude Sonnet</text>
  <text class="s" x="456" y="274">Writes the final</text>
  <text class="s" x="456" y="292">résumé and letter text</text>

  <rect class="box" x="232" y="220" width="176" height="96" rx="14"/>
  <text class="h" x="248" y="252">Validators</text>
  <text class="s" x="248" y="274">Check every metric and</text>
  <text class="s" x="248" y="292">technology claim</text>

  <rect class="box" x="24" y="220" width="176" height="96" rx="14"/>
  <text class="h" x="40" y="252">LaTeX PDF</text>
  <text class="s" x="40" y="274">Print-ready résumé</text>
  <text class="s" x="40" y="292">and cover letter</text>

  <path class="line" d="M200 88 H228" marker-end="url(#arr)"/>
  <path class="line" d="M408 88 H436" marker-end="url(#arr)"/>
  <path class="line" d="M528 136 V216" marker-end="url(#arr)"/>
  <path class="line" d="M440 268 H412" marker-end="url(#arr)"/>
  <path class="line" d="M232 268 H204" marker-end="url(#arr)"/>

  <text class="n" x="232" y="160">Groq and local Ollama score first.</text>
  <text class="n" x="232" y="178">Claude Haiku is the fallback.</text>
  <text class="n" x="24" y="362">Red-flag rules and a content-hash cache run before any model call.</text>
</svg>
